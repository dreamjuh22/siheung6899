<header class="site-header">
  <div class="container header-inner">

    <a class="brand" href="./index.html">
      <span class="brand-mark">
        <img
          src="./images/worker.webp"
          alt="뚜러뚜러하수구"
        >
      </span>

      <strong>뚜러뚜러하수구</strong>
    </a>

    <nav class="desktop-nav">
      <a href="#services">서비스</a>
      <a href="#cases">시공사례</a>
      <a href="#areas">지역</a>
    </nav>

    <a
      class="header-call"
      data-phone-link
      href="#contact"
    >
      전화문의
    </a>

  </div>
</header>


<main id="main">

  <!-- 메인 히어로 -->
  <section class="hero">
    <div class="hero-overlay"></div>

    <div class="container hero-inner">

      <div class="hero-content">

        <p class="hero-location">
          경기도 · 안산 · 시흥 하수구
        </p>

        <h1>
          막힘부터 역류까지,<br>
          <span>배관 상태를 확인하고</span><br>
          확실하게 작업합니다.
        </h1>

        <p class="hero-lead">
          싱크대·화장실·하수구 막힘부터 배관 고압세척까지.<br>
          현장 상태를 확인한 뒤 맞춤 작업을 진행합니다.
        </p>

        <div class="hero-actions">

          <a
            class="hero-button hero-button-call"
            data-phone-link
            href="#contact"
          >
            전화 상담하기
          </a>

          <a
            class="hero-button hero-button-case"
            href="#cases"
          >
            시공사례
          </a>

        </div>

        <p class="hero-note">
          ※ 작업 가능 여부와 비용은 현장 상태 및 작업 범위 확인 후 안내됩니다.
        </p>

      </div>

    </div>
  </section>


  <!-- 서비스 -->
  <section class="section services-section" id="services">
    <div class="container">

      <div class="section-heading service-heading">

        <p class="section-kicker">
          뚜러뚜러하수구
        </p>

        <h2>
          하수구 문제, 증상에 맞게
        </h2>

        <p>
          막힌 위치와 원인에 따라 필요한 점검과 작업 방법은 달라집니다.
        </p>

      </div>


      <div class="service-image-grid">

        <article class="service-image-card">

          <img
            src="./images/services/service-01.webp"
            alt="하수구 싱크대 막힘 작업"
          >

          <div class="service-image-label">
            하수구·싱크대 막힘
          </div>

        </article>


        <article class="service-image-card">

          <img
            src="./images/services/service-02.webp"
            alt="오수배관 막힘 작업"
          >

          <div class="service-image-label">
            오수배관 막힘
          </div>

        </article>


        <article class="service-image-card">

          <img
            src="./images/services/service-03.webp"
            alt="누수탐지 및 누수공사"
          >

          <div class="service-image-label">
            누수탐지·누수공사
          </div>

        </article>


        <article class="service-image-card">

          <img
            src="./images/services/service-04.webp"
            alt="메인배관 고압세척"
          >

          <div class="service-image-label">
            메인배관·고압세척
          </div>

        </article>

      </div>

    </div>
  </section>
